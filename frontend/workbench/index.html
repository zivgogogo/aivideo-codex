<body>
<div class="app">

<main class="workspace">

<script>
'use strict';
const app={newCharacterDraft:{name:'',base_prompt:'',look_name:'',look_prompt_delta:''},newCharacter:false,newCharacterSaving:false,reviewVideo:null,shotDrafts:{},shotEditors:{},newLookDraft:{name:'',prompt:''},newLocationDraft:{name:'',canonical_prompt:''},newLocation:false,newLocationSaving:false,videoPreviews:{},newLook:false,state:null,episode:null,tab:'characters',nav:'production',modal:null,modalAsset:null,modalStage:'base',lookId:null,upload:null,source:null,sourceLoading:false,jobsOpen:false,loading:false,lastMainSignature:'',lastModalSignature:'',error:null};
const $=s=>document.querySelector(s);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=value=>Array.isArray(value)?value:[];
const str=value=>typeof value==='string'?value:JSON.stringify(value??'');
const labelStatus=status=>({idle:'待开始',running:'正在制作',paused:'已暂停派发',pausing:'等待已提交任务保存',failed:'需要处理',rejected:'未通过',needs_review:'中断待核实',unplanned:'待规划',complete:'全部完成',queued:'排队中',pending:'待生成',submitted:'已提交',generating:'生成中',processing:'处理中',succeeded:'已完成',success:'已完成',ready:'候选已就绪',generated:'已生成',reviewed:'已检查',approved:'已通过',exported:'已导出',planned:'已规划',stale:'需更新',cancelled:'已取消'}[String(status??'').toLowerCase()]||String(status||'待处理'));
const success=status=>['success','succeeded','ready','generated','reviewed','approved','exported','complete','completed','SUCCEEDED'].includes(status);
const usable=asset=>!!asset&&!asset.stale&&!failed(asset.status);
const failed=status=>['failed','error','FAILED','rejected','needs_review'].includes(status);
const active=status=>['running','queued','submitted','generating','processing','pending','PENDING','RUNNING'].includes(status);
const stateClass=status=>success(status)?'success':failed(status)?'failed':active(status)?'running':'';
const kindLabel=kind=>({base:'基础人物图',look:'形象图',turnaround:'三视图',location:'场景图',video:'镜头视频',plan:'剧集规划',render:'成片导出',continuity:'连续性复核',review:'连续性复核',run:'全剧制作',image:'图像生成'}[kind]||kind||'任务');
const formatTime=value=>{if(!value)return '时间未记录';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})};
const fullTime=value=>{if(!value)return '';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})};
const durationLabel=value=>{const s=Number(value)||0;return s>=60?Math.floor(s/60)+'分'+Math.round(s%60)+'秒':s+'秒'};
const assetUrl=asset=>asset?.url||asset?.download_url||asset?.video_url||'';
function currentEpisode(){return arr(app.state?.episodes).find(e=>e.id===app.episode)||arr(app.state?.episodes)[0]||null}
function characterById(id){return arr(app.state?.characters).find(c=>c.id===id)}
function locationById(id){return arr(app.state?.locations).find(c=>c.id===id)}
function identityId(value){return typeof value==='string'?value:value?.id||value?.character_id||value?.location_id}
function selectedId(entity,kind,lookId){const s=entity?.selected;if(typeof s==='string')return s;if(!s||typeof s!=='object')return null;const key=kind==='base'?'base':kind==='turnaround'?'turnaround:'+lookId:kind==='location'?'location':kind==='video'?'video':lookId;const value=s[key]??s[kind];return typeof value==='string'?value:value?.id||value?.asset_id||null}
function selectedAsset(entity,kind,lookId){const id=selectedId(entity,kind,lookId);return arr(entity?.assets).find(a=>a.id===id)||null}
function assetVersion(asset,index){if(asset?.version!==undefined&&asset?.version!==null)return typeof asset.version==='number'?'v'+String(asset.version).padStart(3,'0'):String(asset.version);return 'v'+String(index+1).padStart(3,'0')}
function validAssets(entity,kind,lookId){return arr(entity?.assets).filter(a=>a.kind===kind&&(!lookId||kind==='base'||kind==='location'||!a.look_id||a.look_id===lookId)).slice().reverse()}
function episodeCharacters(ep){const ids=new Set([...arr(ep?.characters).map(identityId),...arr(ep?.shots).flatMap(s=>arr(s.characters).map(identityId))]);return arr(app.state?.characters).filter(c=>ids.has(c.id))}
function episodeLocations(ep){const ids=new Set([...arr(ep?.locations).map(identityId),...arr(ep?.shots).map(s=>identityId(s.location_id))]);return arr(app.state?.locations).filter(c=>ids.has(c.id))}
function shotSelected(shot){const s=shot?.selected;const id=typeof s==='string'?s:s?.video||s?.asset_id||s?.id;return arr(shot?.assets).find(a=>a.id===id)||null}
function episodeTitle(ep){return ep?.source_title||ep?.title||('第'+(ep?.number||'')+'集')}
function projectTitle(){return app.state?.project?.title||app.state?.project?.name||'AI 短剧制作项目'}
function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;$('#toast-stack').appendChild(el);setTimeout(()=>el.remove(),error?11000:5000)}
async function api(path,body){let response;try{response=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'})}catch(error){throw new Error('无法连接本地制作服务。请检查服务是否正在运行。')}const text=await response.text();let data;try{data=JSON.parse(text)}catch(error){throw new Error('服务返回了无法识别的数据（HTTP '+response.status+'）')}if(!response.ok||data.error||data.ok===false)throw new Error(typeof data.error==='string'?data.error:data.error?.message||data.message||'操作失败（HTTP '+response.status+'）');return data}
async function fetchState(force=false){if(app.loading)return;app.loading=true;try{app.state=await api('/api/state');app.error=null;if(!app.episode||!arr(app.state.episodes).some(e=>e.id===app.episode))app.episode=arr(app.state.episodes)[0]?.id||null;$('#connection-error').classList.add('hidden');$('#connection-dot').classList.add('online');$('#connection-label').textContent='本地工作台已连接';$('#last-sync').textContent='最近同步 '+new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});render(force)}catch(error){app.error=error.message;$('#connection-error').textContent=error.message;$('#connection-error').classList.remove('hidden');$('#connection-dot').classList.remove('online');$('#connection-label').textContent='连接中断';if(!app.state)$('#main-content').innerHTML='<div class="empty"><div><h3>等待本地制作服务</h3><p>服务连接后将显示真实的剧集、素材和生成任务。</p><button data-action="refresh">重新连接</button></div></div>'}finally{app.loading=false}}
function render(force=false){if(!app.state)return;renderHeader();renderEpisodeNav();renderFailures();renderJobs();const signature=JSON.stringify({nav:app.nav,tab:app.tab,episode:app.episode,characters:app.state.characters,locations:app.state.locations,episodes:app.state.episodes,exports:app.state.exports,reviewRunning:reviewRunning(currentEpisode())});if(force||signature!==app.lastMainSignature){const focused=document.activeElement,playing=Array.from(document.querySelectorAll('#main-content video')).some(v=>!v.paused&&!v.ended);if(force||(!playing&&(!focused||!$('#main-content').contains(focused)||!['TEXTAREA','INPUT','SELECT'].includes(focused.tagName)))){renderMain();app.lastMainSignature=signature}}if(app.modal){const modalSignature=JSON.stringify({m:app.modal,stage:app.modalStage,look:app.lookId,asset:app.modalAsset,upload:app.upload,characters:app.state.characters,locations:app.state.locations});if(force||modalSignature!==app.lastModalSignature){const focused=document.activeElement;if(force||!focused||!$('#modal-root').contains(focused)||!['TEXTAREA','INPUT','SELECT'].includes(focused.tagName)){renderModal();app.lastModalSignature=modalSignature}}}}
function renderHeader(){const state=app.state,eps=arr(state.episodes),chars=arr(state.characters),shots=eps.flatMap(e=>arr(e.shots)),done=shots.filter(s=>usable(shotSelected(s))).length,exported=eps.filter(e=>e.export&&assetUrl(e.export)).length;const totalLooks=chars.reduce((a,c)=>a+arr(c.looks).length,0);$('#side-title').textContent=projectTitle();$('#project-title').textContent=projectTitle();$('#project-description').textContent=state.project?.description||'从剧集规划到人物形象、场景与镜头，统一管理参考、提示词和每一次生成。';$('#stats').innerHTML=[['剧集规划',eps.length,'集','▦'],['人物 / 形象',chars.length+' / '+totalLooks,'','♙'],['采用镜头',done+' / '+shots.length,'镜','▧'],['剧集成片',exported+' / '+eps.length,'集','↗']].map(([name,value,unit,icon])=>'<div class="stat"><div><label>'+name+'</label><strong>'+esc(value)+'</strong><small>'+unit+'</small></div><span class="stat-icon">'+icon+'</span></div>').join('');const running=state.project?.run_status==='running'||state.project?.running===true,draining=!running&&arr(state.jobs).some(j=>j.kind!=='run'&&active(j.status));$('#pause-button').classList.toggle('hidden',!running);$('#run-button').disabled=running||draining;$('#run-button').innerHTML='<span class="run-button-label">'+(running?'制作进行中…':draining?'等待已提交任务保存…':state.project?.run_status==='paused'?'▶ 从断点继续':'▶ 继续全剧制作')+'</span>';$('#run-state').textContent=labelStatus(state.project?.run_status||'idle');$('#jobs-count').textContent=arr(state.jobs).filter(j=>active(j.status)).length;$('#project-path').textContent=state.project?.root||state.project?.path||state.project?.project_path||'';$('#nav-production').classList.toggle('active',app.nav==='production');$('#nav-overview').classList.toggle('active',app.nav==='overview')}
function renderEpisodeNav(){const eps=arr(app.state.episodes),signature=JSON.stringify([app.episode,eps.map(ep=>[ep.id,episodeTitle(ep),!!(ep.export&&assetUrl(ep.export))])]);if(app.lastNavSignature===signature)return;app.lastNavSignature=signature;const oldScroll=$('#episode-nav').scrollLeft;$('#episode-jump').innerHTML=eps.map(ep=>'<option value="'+esc(ep.id)+'" '+(ep.id===app.episode?'selected':'')+'>'+esc(ep.id)+' · '+esc(episodeTitle(ep))+'</option>').join('');$('#episode-nav').innerHTML=eps.map(ep=>'<button class="episode-chip '+(app.episode===ep.id?'active':'')+'" data-action="episode" data-id="'+esc(ep.id)+'" title="'+esc(episodeTitle(ep))+'"><span class="chip-dot '+(ep.export&&assetUrl(ep.export)?'done':'')+'"></span><span class="num">EP '+String(ep.number||Number(String(ep.id).replace(/\D/g,''))||'').padStart(2,'0')+'</span><span class="name">'+esc(episodeTitle(ep))+'</span></button>').join('');$('#episode-nav').scrollLeft=oldScroll;$('#episode-nav .active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function renderFailures(){const jobs=arr(app.state.jobs),bad=jobs.filter(j=>failed(j.status)),latest=bad[bad.length-1],blocked=app.state.project?.run_status==='failed',current=app.state.project?.last_error;$('#failure-banner').innerHTML=blocked?'<div class="notice error failed-banner"><span><strong>当前制作需要处理</strong> · '+esc(str(current||latest?.error||'打开任务查看详情').slice(0,150))+'</span><button class="small danger" data-action="jobs">查看任务</button></div>':latest?'<div class="notice failed-banner"><span>'+bad.length+' 条历史失败记录，保留供追溯；当前状态以制作任务为准。</span><button class="small ghost" data-action="jobs">查看记录</button></div>':''}
function reviewRunning(ep){return !!ep&&arr(app.state?.jobs).some(j=>['continuity','review'].includes(j.kind)&&[ep.id,'series'].includes(j.target)&&active(j.status))}
function renderReview(ep){
 const review=ep.continuity_review,running=reviewRunning(ep),notes=Array.isArray(review?.notes)?review.notes:review?.notes?[str(review.notes)]:[];
 return '<div class="notice review-notice"><div class="review-title"><strong>连续性复核</strong><span class="status '+(running?'running':stateClass(review?.status))+'">'+(running?'正在复核…':review?esc(labelStatus(review.status))+' · 修正 '+esc(review.patch_count??0)+' 处':'尚未复核')+'</span></div><p>模型会检查并修正角色服装、道具与位置的连续性，保留原台词；实际复核可能需要一些时间。全剧制作会自动执行，通常无需重复提交。</p>'+(notes.length?'<ul>'+notes.map(note=>'<li>'+esc(str(note))+'</li>').join('')+'</ul>':'')+'</div>';
}
function renderMain(){const ep=currentEpisode();if(app.nav==='overview'){renderOverview();return}if(!ep){$('#main-content').innerHTML='<div class="empty"><div><h3>项目尚未载入剧集</h3><p>规划完成后，人物、场景、分镜和导出会按剧集组织在这里。</p><button class="primary" data-action="plan-all">规划全剧</button></div></div>';return}const counts={characters:episodeCharacters(ep).length,locations:episodeLocations(ep).length,shots:arr(ep.shots).length,exports:ep.export&&assetUrl(ep.export)?1:0};$('#main-content').innerHTML='<div class="episode-heading"><div><h2>'+esc(episodeTitle(ep))+'<span class="source-id">'+esc(ep.id)+'</span></h2><p>'+esc(ep.summary||'这一集的制作线将在分镜规划后展开。')+'</p></div><div class="episode-head-actions"><button class="small" data-action="plan-episode">✧ '+(arr(ep.shots).length?'重新规划本集':'规划本集')+'</button>'+(app.tab==='shots'?'<button class="small" data-action="review-episode" '+(!arr(ep.shots).length||reviewRunning(ep)?'disabled':'')+'>'+(reviewRunning(ep)?'复核中…':'复核连续性')+'</button>':'')+'</div></div><div class="tabs">'+[['characters','人物形象'],['locations','场景资产'],['shots','镜头分镜'],['exports','成片导出']].map(([key,label])=>'<button class="'+(app.tab===key?'active':'')+'" data-action="tab" data-tab="'+key+'">'+label+'<small>'+counts[key]+'</small></button>').join('')+'</div><div id="tab-body"></div>';({characters:renderCharacters,locations:renderLocations,shots:renderShots,exports:renderExports}[app.tab]||renderCharacters)(ep)}
function emptyState(title,text,button){return '<div class="empty"><div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(button||'')+'</div></div>'}

async function createCharacter(){
 if(app.newCharacterSaving)return;
 const ep=currentEpisode(),name=$('#new-character-name')?.value.trim()||'',base_prompt=$('#new-character-base')?.value.trim()||'';
 const lookName=$('#new-character-look-name')?.value.trim()||'',lookPrompt=$('#new-character-look-prompt')?.value.trim()||'';
 if(!ep)throw new Error('请先选择剧集。');
 if(!name||!base_prompt)throw new Error('请填写人物名称和基础身份描述。');
 if(!!lookName!==!!lookPrompt)throw new Error('首个服装形象的名称和描述请同时填写，或同时留空。');
 app.newCharacterSaving=true;
 try{
  const body={name,base_prompt,episode_id:ep.id,...(lookName?{look:{name:lookName,prompt_delta:lookPrompt}}:{})};
  const result=await api('/api/character',body);
  if(!result.character?.id)throw new Error('服务未返回新人物，请刷新后查看。');
  app.newCharacter=false;app.newCharacterDraft={name:'',base_prompt:'',look_name:'',look_prompt_delta:''};
  while(app.loading)await new Promise(resolve=>setTimeout(resolve,25));
  await fetchState(true);
  if(app.error)throw new Error('人物已创建，刷新失败：'+app.error);
  openEntity('character',result.character.id);
  toast('已创建独立人物。可在基础人物版本面板中生成第一张身份图。');
 }finally{app.newCharacterSaving=false;if(app.nav==='production'&&app.tab==='characters')renderCharacters(currentEpisode())}
}

function videoPlaybackUrl(asset){return assetUrl(asset)||(asset?.path&&!String(asset.path).startsWith('/')?'/media/'+String(asset.path).split('/').map(encodeURIComponent).join('/'):'')}
function canReviewVideo(asset){return !!asset&&asset.status==='rejected'&&asset.qa?.technical_pass===true&&!asset.stale&&!!videoPlaybackUrl(asset)}
function videoState(asset){return canReviewVideo(asset)?'自动质检待复核':labelStatus(asset?.status)}
function renderVideoQa(asset,open=false){
 const qa=asset?.qa;if(!qa)return '';
 const visual=qa.visual||{},manual=asset.manual_review||asset.human_review,defects=arr(visual.defects);
 const flag=value=>value===true?'通过':value===false?'未通过':'未检查';
 return '<details class="shot-details shot-qa" '+(open?'open':'')+'><summary>原自动质检结果</summary><div class="qa-result"><div class="qa-score"><span class="tag">技术：'+flag(qa.technical_pass)+'</span><span class="tag">画面：'+flag(qa.visual_pass)+'</span><span class="tag">台词：'+flag(qa.audio_pass)+'</span></div>'+(visual.reason?'<p><strong>原 AI 评语</strong> '+esc(visual.reason)+'</p>':'')+(defects.length?'<ul>'+defects.map(d=>'<li>'+esc(str(d))+'</li>').join('')+'</ul>':'')+(qa.transcript?'<p><strong>识别台词</strong> '+esc(qa.transcript)+'</p>':'')+(qa.audio_limitations?'<p class="subtle">'+esc(qa.audio_limitations)+'</p>':'')+(manual?'<p><strong>手动复核记录</strong> '+esc(manual.notes||str(manual))+'</p>':'')+'</div></details>';
}

 if(!canReviewVideo(asset))throw new Error('这个版本当前不符合手动复核条件，请刷新后查看状态。');

async function saveShotStoryboard(shotId){
 const changes={};
 for(const field of ['action','camera','continuity_in','continuity_out'])changes[field]=document.getElementById('edit-'+shotId+'-'+field).value;
 changes.location_id=document.getElementById('edit-'+shotId+'-location_id').value;
 if(!changes.location_id)throw new Error('请选择镜头场景。');
 const reason=document.getElementById('edit-'+shotId+'-reason').value.trim();
 await api('/api/shot',{episode_id:currentEpisode().id,shot_id:shotId,changes,...(reason?{reason}:{})});
 delete app.shotDrafts[shotId];
 toast('分镜已保存。依赖旧分镜的视频已标记过期，重新生成后可采用。');
 await fetchState(true);
}

 }).join('')+'</div>';

function renderExports(ep){const shots=arr(ep.shots),done=shots.filter(s=>usable(shotSelected(s))).length,ready=shots.length>0&&done===shots.length,exports=arr(app.state.exports),episodeExport=ep.export&&assetUrl(ep.export)?ep.export:exports.find(e=>e.episode_id===ep.id&&assetUrl(e));const allExport=exports.filter(e=>!e.episode_id||['all','series','ALL'].includes(e.episode_id)).find(e=>assetUrl(e));$('#tab-body').innerHTML='<div class="export-card"><div class="eyebrow">EPISODE MASTER</div><h3>'+esc(episodeTitle(ep))+'</h3><p>采用镜头 '+done+' / '+shots.length+'。导出使用每个镜头当前采用的版本，原始生成文件与历史版本继续保留。</p><div class="progress-track"><span style="width:'+(shots.length?Math.round(done/shots.length*100):0)+'%"></span></div>'+(episodeExport?exportMarkup(episodeExport):'<div class="notice" style="margin-top:18px">'+(ready?'全部镜头已采用，可以导出本集成片。':'完成并采用这一集的全部镜头后，即可导出成片。')+'</div>')+'<div class="export-actions"><button class="primary" data-action="render-episode" '+(ready?'':'disabled')+'>↗ '+(episodeExport?'重新导出本集':'导出本集成片')+'</button></div></div><div class="export-card"><div class="eyebrow">COMPLETE SERIES</div><h3>全剧合辑</h3><p>全部剧集制作完成后，按剧集顺序导出整剧。只会使用实际生成的视频。</p>'+(allExport?exportMarkup(allExport):'')+'<button data-action="render-all">导出已完成剧集 / 全剧</button></div>'}
function exportMarkup(item){return '<video controls playsinline preload="metadata" src="'+esc(assetUrl(item))+'"></video><div class="export-meta">'+(item.duration?'<span>时长 '+esc(durationLabel(item.duration))+'</span>':'')+(item.created_at?'<span>'+esc(fullTime(item.created_at))+'</span>':'')+(item.version?'<span>'+esc(item.version)+'</span>':'')+'</div><div class="export-actions" style="margin-bottom:15px"><a class="download-link" href="'+esc(assetUrl(item))+'" download>↓ 下载成片</a><a class="fine" href="'+esc(assetUrl(item))+'" target="_blank" rel="noopener">在新窗口播放 ↗</a></div>'}
function renderOverview(){const eps=arr(app.state.episodes);$('#main-content').innerHTML='<div class="episode-heading"><div><h2>全剧制作进度</h2><p>人物与场景使用全局资产库，各集以具体的形象、参考版本和镜头串起制作线。</p></div><button class="small" data-action="plan-all">规划全剧</button></div><div class="overview-grid">'+eps.map(ep=>{const shots=arr(ep.shots),done=shots.filter(s=>usable(shotSelected(s))).length,pct=shots.length?Math.round(done/shots.length*100):0;return '<article class="episode-overview"><div class="eyebrow">'+esc(ep.id)+'</div><h3>'+esc(episodeTitle(ep))+'</h3><p>'+esc(ep.summary||'等待剧集规划')+'</p><div class="progress-track"><span style="width:'+pct+'%"></span></div><div class="overview-line"><span>'+done+' / '+shots.length+' 镜已采用</span><span class="status '+(ep.export&&assetUrl(ep.export)?'success':'')+'">'+(ep.export&&assetUrl(ep.export)?'成片已导出':pct+'%')+'</span></div><button class="small" data-action="episode" data-id="'+esc(ep.id)+'">进入本集制作 ↗</button></article>'}).join('')+'</div>'}
function renderJobs(){const panel=$('#jobs-panel');panel.classList.toggle('hidden',!app.jobsOpen);if(!app.jobsOpen)return;const jobs=arr(app.state?.jobs).slice().reverse();panel.innerHTML='<div class="panel-head"><h3>生成任务 <span class="subtle fine">'+jobs.length+'</span></h3><button class="small ghost" data-action="close-jobs">关闭 ×</button></div>'+(jobs.length?jobs.map(j=>'<div class="job"><div class="job-top"><span>'+esc(kindLabel(j.kind))+' · '+esc(typeof j.target==='string'?j.target:JSON.stringify(j.target||''))+'</span><span class="status '+stateClass(j.status)+'">'+esc(labelStatus(j.status))+'</span></div><div class="job-meta">'+esc(j.id)+' · '+esc(formatTime(j.created_at))+'</div>'+(j.error?'<div class="job-error">'+esc(str(j.error))+'</div>':'')+(j.task_id?'<div class="job-meta">模型任务 '+esc(j.task_id)+'</div>':'')+'</div>').join(''):'<div class="empty-inline" style="padding:25px">还没有生成任务。规划和生成后会在这里记录实际状态。</div>')}
function modalEntity(){return app.modal?.type==='character'?characterById(app.modal.id):locationById(app.modal?.id)}
function modalLook(entity){return arr(entity?.looks).find(l=>l.id===app.lookId)||arr(entity?.looks)[0]}
function openEntity(type,id){app.newLook=false;app.newLookDraft={name:'',prompt:''};app.modal={type,id};app.modalStage=type==='character'?'base':'location';app.lookId=arr((type==='character'?characterById(id):null)?.looks)[0]?.id||null;app.modalAsset=null;app.upload=null;app.lastModalSignature='';renderModal()}
function renderModal(){if(!app.modal)return;const entity=modalEntity();if(!entity){closeModal();return}const isChar=app.modal.type==='character',look=modalLook(entity),stage=app.modalStage;if(look&&!app.lookId)app.lookId=look.id;const assets=validAssets(entity,stage,app.lookId),chosen=selectedAsset(entity,stage,app.lookId);let preview=assets.find(a=>a.id===app.modalAsset)||chosen||assets[0];if(preview)app.modalAsset=preview.id;const prompt=isChar?(stage==='base'?entity.base_prompt||'':look?.prompt_delta||look?.prompt||''):entity.canonical_prompt||'';const draftKey=entity.id+':'+stage+':'+(app.lookId||'');if(app.modal.draftKey!==draftKey){app.modal.draft=prompt;app.modal.draftKey=draftKey}const isSelected=preview&&preview.id===chosen?.id,previewReady=preview&&success(preview.status)&&assetUrl(preview);$('#modal-root').innerHTML='<div class="backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(entity.name)+'资产管理"><div class="modal-head"><div><h2>'+esc(entity.name)+' <span class="source-id">'+esc(entity.id)+'</span></h2><p>'+ (isChar?'基础身份 → 形象变体 → 三视图，所有生成保留历史版本。':'场景锁定空间、地标与光线，供本剧不同镜头复用。')+'</p></div><button class="modal-close" data-action="close-modal" aria-label="关闭">×</button></div><div class="modal-layout"><div class="modal-left"><div class="large-preview">'+(previewReady?'<a href="'+esc(assetUrl(preview))+'" target="_blank" rel="noopener"><img src="'+esc(assetUrl(preview))+'" alt="'+esc(entity.name)+' '+kindLabel(stage)+'"></a>':'<div class="empty-image"><span class="avatar-line">'+(isChar?'♙':'⌂')+'</span><span>'+kindLabel(stage)+(preview?' · '+esc(labelStatus(preview.status)):'待生成')+'</span>'+(preview?.error?'<span class="inline-error">'+esc(str(preview.error))+'</span>':'')+'</div>')+'</div><div class="preview-caption"><span>'+ (preview?esc(assetVersion(preview,assets.length-1))+' · '+esc(formatTime(preview.created_at)):'生成后可在此查看并选择版本')+'</span><span class="'+(isSelected?'status success':'')+'">'+(isSelected?(preview?.stale?'已采用 · 参考已更新':'✓ 当前采用'):preview?labelStatus(preview.status):'')+'</span></div><div class="field-label">历史版本 · '+assets.length+'</div><div class="versions">'+(assets.length?assets.map((a,i)=>'<button class="version '+(a.id===preview?.id?'active':'')+'" data-action="preview-asset" data-id="'+esc(a.id)+'" title="'+esc(fullTime(a.created_at))+'">'+(success(a.status)&&assetUrl(a)?'<img src="'+esc(assetUrl(a))+'" alt="'+esc(assetVersion(a,assets.length-i-1))+'">':'')+'<span class="version-label">'+esc(assetVersion(a,assets.length-i-1))+(success(a.status)?'':' · '+esc(labelStatus(a.status)))+'</span>'+(a.id===chosen?.id?'<span class="approved">✓</span>':'')+'</button>').join(''):'<div class="empty-inline">还没有这个阶段的候选素材</div>')+'</div><div class="modal-actions"><button class="primary" data-action="adopt-asset" '+(!previewReady||isSelected||preview.stale?'disabled':'')+'>'+(isSelected?'✓ 已采用该版本':'采用当前候选')+'</button>'+(previewReady?'<a class="download-link" href="'+esc(assetUrl(preview))+'" download>↓ 下载</a>':'')+'</div>'+(preview?.stale?'<p class="inline-error">此资产使用了旧的提示词或参考，建议重生成。</p>':'')+'<p class="modal-tip">采用只更新当前引用，旧版本会继续保留。更换已使用的参考后，下游镜头需要按新版本重新生成。</p></div><div class="modal-right">'+(isChar?'<div class="segmented">'+[['base','① 基础人物'],['look','② 形象'],['turnaround','③ 三视图']].map(([k,l])=>'<button data-action="modal-stage" data-stage="'+k+'" class="'+(stage===k?'active':'')+'">'+l+'</button>').join('')+'</div>':'')+(isChar&&stage!=='base'?'<label class="field-label" for="look-select">当前形象 / 生命周期</label><select id="look-select" data-action="look-change">'+arr(entity.looks).map(l=>'<option value="'+esc(l.id)+'" '+(l.id===app.lookId?'selected':'')+'>'+esc(l.name||l.id)+'</option>').join('')+'</select><button class="small ghost" style="margin-top:9px" data-action="new-look">＋ 新增年龄 / 服装 / 伤疤形象</button>'+(app.newLook?'<div class="look-create"><label class="field-label">新形象名称</label><input id="new-look-name" value="'+esc(app.newLookDraft.name)+'" placeholder="例如：青年 · 左脸伤疤"><label class="field-label" style="margin-top:8px">形象变化 prompt</label><textarea id="new-look-prompt" placeholder="描述年龄、发型、服装或伤疤等变化；基础身份自动继承。">'+esc(app.newLookDraft.prompt)+'</textarea><button class="small primary" data-action="create-look">创建形象</button></div>':'')+'<div class="reference-summary"><strong>人物身份锁</strong><br>'+esc(entity.base_prompt||'基础人物 prompt 待配置')+'</div>':'')+'<div class="field-row"><label for="modal-prompt">'+(isChar?stage==='base'?'全局人物 prompt · 固定身份':'形象补充 prompt · 服装 / 年龄 / 状态':'全局场景 prompt · 布局 / 地标 / 灯光')+'</label><button class="small ghost" data-action="save-modal-prompt">保存 prompt</button></div><textarea id="modal-prompt" class="prompt-editor">'+esc(app.modal.draft??prompt)+'</textarea>'+(isChar&&stage==='look'?'<div class="upload-box">'+(app.upload?'<img src="'+esc(app.upload.url)+'" alt="服装参考"><span>'+esc(app.upload.name||app.upload.path)+'</span><button class="small ghost" data-action="clear-upload">移除</button>':'<span>可上传服装参考，与已采用的基础人物合成新形象。</span><button class="small" data-action="upload">＋ 服装图片</button>')+'</div>':'')+(isChar&&stage!=='base'?'<div class="fine muted">基础图：'+(selectedAsset(entity,'base')?'<span style="color:var(--accent)">已采用</span>':'未采用')+(stage==='turnaround'?' · 形象图：'+(selectedAsset(entity,'look',app.lookId)?'<span style="color:var(--accent)">已采用</span>':'未采用'):'')+'</div>':'')+'<div class="modal-actions"><button class="primary" data-action="generate-modal">'+(assets.length?'↻ 重新生成':'✧ 生成')+kindLabel(stage)+'</button></div><p class="modal-tip">'+(stage==='base'?'固定五官、脸型、肤色、身高体型等身份特征。青年与壮年等新阶段在形象层维护。':stage==='look'?'服装参考仅继承衣服款式和材质；人物身份继承已采用的基础图。':stage==='turnaround'?'以已采用的形象生成正面、侧面和背面参考，用于后续人物一致性。':'描述固定空间关系和灯光方向，让每个镜头有同一套场景依据。')+'</p></div></div></section></div>'}
function closeModal(){app.reviewVideo=null;app.modal=null;app.modalAsset=null;app.upload=null;app.source=null;$('#modal-root').innerHTML=''}
async function saveModalPrompt(silent=false){const entity=modalEntity();if(!entity)return;const prompt=$('#modal-prompt')?.value??app.modal?.draft??'';const body={prompt};if(app.modal.type==='character'){body.character_id=entity.id;if(app.modalStage!=='base')body.look_id=app.lookId}else body.location_id=entity.id;await api('/api/prompt',body);app.modal.draft=prompt;if(!silent)toast('提示词已保存。历史素材继续保留。')}
async function generateModal(){const entity=modalEntity();if(!entity)return;await saveModalPrompt(true);const body={kind:app.modalStage};if(app.modal.type==='character'){body.character_id=entity.id;if(app.modalStage!=='base')body.look_id=app.lookId;if(app.upload?.path)body.reference_paths=[app.upload.path]}else body.location_id=entity.id;const result=await api('/api/image',body);toast('已提交'+kindLabel(body.kind)+(result.job_id?' · '+result.job_id:''));app.jobsOpen=true;await fetchState(true)}
async function adoptAsset(){const entity=modalEntity();if(!entity||!app.modalAsset)return;const body={kind:app.modalStage,asset_id:app.modalAsset};if(app.modal.type==='character'){body.character_id=entity.id;if(app.modalStage!=='base')body.look_id=app.lookId}else body.location_id=entity.id;await api('/api/select',body);toast('已采用这个版本。后续生成将使用它。');await fetchState(true)}
async function openSource(){const ep=currentEpisode();if(!ep){toast('当前没有可查看的剧集原文。',true);return}app.sourceLoading=true;$('#modal-root').innerHTML='<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="剧本原文"><div class="modal-head"><div><h2>'+esc(episodeTitle(ep))+' · 原文</h2><p>原文作为改编内容使用。</p></div><button class="modal-close" data-action="close-modal">×</button></div><div class="source-content" id="source-text">正在读取剧本…</div></section></div>';const result=await api('/api/source?episode_id='+encodeURIComponent(ep.id));if($('#source-text'))$('#source-text').textContent=typeof result==='string'?result:result.text||result.content||result.source||JSON.stringify(result,null,2);app.sourceLoading=false}
async function submit(path,body,message){const result=await api(path,body);toast(message+(result.job_id?' · '+result.job_id:''));await fetchState(true);return result}
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(button.disabled)return;const oldDisabled=button.disabled;const slow=['run','pause','plan-all','plan-episode','review-episode','quick-base','quick-location','save-shot','save-storyboard','adopt-video','video','render-episode','render-all','generate-modal','create-look','adopt-asset','save-modal-prompt','confirm-video-review'].includes(action);if(slow)button.disabled=true;try{switch(action){case'refresh':await fetchState(true);break;case'nav':if(button.dataset.nav==='jobs'){app.jobsOpen=true;renderJobs()}else{app.nav=button.dataset.nav;render(true)}break;case'episode':app.episode=button.dataset.id;app.nav='production';render(true);break;case'tab':app.tab=button.dataset.tab;render(true);break;case'jobs':app.jobsOpen=!app.jobsOpen;renderJobs();break;case'close-jobs':app.jobsOpen=false;renderJobs();break;case'run':await submit('/api/run',{},'全剧制作已开始，将从当前断点继续。');break;case'pause':await submit('/api/pause',{},'已暂停派发。已提交的任务会继续保存结果。');break;case'plan-all':await submit('/api/plan',{},'已提交全剧规划任务。');app.jobsOpen=true;renderJobs();break;case'plan-episode':if(currentEpisode())await submit('/api/plan',{episode_id:currentEpisode().id},'已提交本集规划任务。');app.jobsOpen=true;renderJobs();break;case'review-episode':await submit('/api/review',{episode_id:currentEpisode().id},'已提交本集连续性复核，模型检查可能需要一些时间。');app.jobsOpen=true;renderJobs();break;case'character':openEntity('character',button.dataset.id);break;case'location':openEntity('location',button.dataset.id);break;case'new-character':app.newCharacter=!app.newCharacter;renderCharacters(currentEpisode());break;case'new-location':app.newLocation=!app.newLocation;renderLocations(currentEpisode());break;case'quick-base':await submit('/api/image',{character_id:button.dataset.id,kind:'base'},'已提交人物基础图生成。');openEntity('character',button.dataset.id);break;case'quick-location':await submit('/api/image',{location_id:button.dataset.id,kind:'location'},'已提交场景图生成。');openEntity('location',button.dataset.id);break;case'close-modal':closeModal();break;case'modal-stage':app.modalStage=button.dataset.stage;app.modalAsset=null;renderModal();break;case'new-look':app.newLook=!app.newLook;renderModal();break;case'create-look':{const name=$('#new-look-name')?.value.trim(),prompt_delta=$('#new-look-prompt')?.value.trim();if(!name)throw new Error('请填写新形象名称。');const result=await api('/api/look',{character_id:app.modal.id,name,prompt_delta:prompt_delta||''});app.newLook=false;app.newLookDraft={name:'',prompt:''};app.lookId=result.look?.id||null;app.modalAsset=null;app.modal.draftKey=null;toast('已新增形象，可以生成独立的形象图和三视图。');await fetchState(true);break}case'preview-asset':app.modalAsset=button.dataset.id;renderModal();break;case'save-modal-prompt':await saveModalPrompt();await fetchState();break;case'generate-modal':await generateModal();break;case'adopt-asset':await adoptAsset();break;case'upload':$('#reference-upload').value='';$('#reference-upload').click();break;case'clear-upload':app.upload=null;renderModal();break;case'manual-review-video':openVideoReview(button.dataset.shot,button.dataset.id);break;case'confirm-video-review':await confirmVideoReview();break;case'adopt-video':await submit('/api/select-video',{episode_id:currentEpisode().id,shot_id:button.dataset.shot,asset_id:button.dataset.id},'已采用这个镜头版本。');break;case'video':await submit('/api/video',{episode_id:currentEpisode().id,shot_id:button.dataset.id},'已提交镜头视频生成。');app.jobsOpen=true;renderJobs();break;case'save-storyboard':await saveShotStoryboard(button.dataset.id);break;case'save-shot':await submit('/api/prompt',{episode_id:currentEpisode().id,shot_id:button.dataset.id,prompt:document.getElementById('prompt-'+button.dataset.id).value},'镜头 prompt 已保存。');break;case'render-episode':await submit('/api/render',{episode_id:currentEpisode().id},'已提交本集成片导出。');app.jobsOpen=true;renderJobs();break;case'render-all':await submit('/api/render',{},'已提交剧集 / 全剧导出任务。');app.jobsOpen=true;renderJobs();break;case'source':await openSource();break}}catch(error){toast(error.message,true)}finally{if(slow&&button.isConnected)button.disabled=oldDisabled}});
document.addEventListener('submit',async event=>{if(event.target.id!=='new-location-form')return;event.preventDefault();const button=event.target.querySelector('button[type="submit"]');if(button)button.disabled=true;try{await createLocation()}catch(error){toast(error.message,true)}finally{if(button?.isConnected)button.disabled=false}});
document.addEventListener('change',async event=>{const el=event.target;try{if(el.dataset.editShot&&el.dataset.editField==='location_id'){app.shotDrafts[el.dataset.editShot]??={};app.shotDrafts[el.dataset.editShot].location_id=el.value;}if(el.dataset.action==='episode-jump-change'){app.episode=el.value;app.nav='production';render(true)}if(el.dataset.action==='look-change'){app.lookId=el.value;app.modalAsset=null;renderModal()}if(el.dataset.action==='shot-look-change'&&el.value){await api('/api/shot-look',{episode_id:currentEpisode().id,shot_id:el.dataset.shot,character_id:el.dataset.character,look_id:el.value});toast('已更新这个镜头的人物形象。');await fetchState(true)}if(el.dataset.action==='preview-video-change'&&el.value){app.videoPreviews[el.dataset.shot]=el.value;renderMain()}if(el.id==='reference-upload'&&el.files?.[0]){const file=el.files[0];if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('请使用 PNG、JPEG 或 WebP 图片。');if(file.size>10*1024*1024)throw new Error('参考图片请控制在 10MB 以内。');toast('正在上传服装参考…');const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('无法读取所选图片。'));reader.readAsDataURL(file)});const result=await api('/api/upload',{name:file.name,data:base64});app.upload={...result,name:file.name};toast('服装参考已保存。生成形象时会作为参考使用。');renderModal()}}catch(error){toast(error.message,true)}});
document.addEventListener('input',event=>{const characterField={'new-character-name':'name','new-character-base':'base_prompt','new-character-look-name':'look_name','new-character-look-prompt':'look_prompt_delta'}[event.target.id];if(characterField)app.newCharacterDraft[characterField]=event.target.value;if(event.target.id==='new-location-name')app.newLocationDraft.name=event.target.value;if(event.target.id==='new-location-prompt')app.newLocationDraft.canonical_prompt=event.target.value;if(event.target.dataset.editShot){const shotId=event.target.dataset.editShot;app.shotDrafts[shotId]??={};app.shotDrafts[shotId][event.target.dataset.editField]=event.target.value;}if(event.target.id==='modal-prompt'&&app.modal)app.modal.draft=event.target.value;if(event.target.id==='new-look-name')app.newLookDraft.name=event.target.value;if(event.target.id==='new-look-prompt')app.newLookDraft.prompt=event.target.value});
document.addEventListener('submit',async event=>{if(event.target.id!=='new-character-form')return;event.preventDefault();const button=event.target.querySelector('[type=submit]');if(button)button.disabled=true;try{await createCharacter()}catch(error){toast(error.message,true)}finally{if(button?.isConnected)button.disabled=false}});
document.addEventListener('toggle',event=>{if(event.target.dataset?.shotEditor)app.shotEditors[event.target.dataset.shotEditor]=event.target.open},true);
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();app.jobsOpen=false;renderJobs()}});
document.addEventListener('click',event=>{if(event.target.classList.contains('backdrop'))closeModal()});
window.addEventListener('focus',()=>fetchState());
fetchState();setInterval(()=>{if(!document.hidden)fetchState()},3500);
</script>
