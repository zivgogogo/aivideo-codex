name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Noto CJK font for subtitle export
        run: |
          # Official Noto source, pinned to a commit and content checksum.
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/NotoSansCJK-Regular.ttc" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTC/NotoSansCJK-Regular.ttc
          echo "b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  $RUNNER_TEMP/NotoSansCJK-Regular.ttc" | sha256sum --check
          sudo install -D -m 644 "$RUNNER_TEMP/NotoSansCJK-Regular.ttc" /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Initialize a fresh checkout
        run: python scripts/setup_project.py
      - name: Check upload contents and Git history
        run: python scripts/dev/check_repository.py
      - name: Run offline regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check frontend/shared/app-update.js
          node --check frontend/canvas/canvas.js
          node --check frontend/canvas/canvas-sync.js
          node --check frontend/canvas/canvas-compose.js
      - run: git diff --check

  windows-projects:
    name: Windows project encoding (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '0'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies and Windows timezone data
        run: python -m pip install -r requirements.txt tzdata
      - name: Check project creation and UTF-8 files with GBK defaults
        run: python -m unittest tests.canvas.test_windows_encoding -v
