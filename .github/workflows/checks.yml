name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts for subtitle export
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Initialize a fresh checkout
        run: python scripts/setup_project.py
      - name: Check upload contents and Git history
        run: python scripts/dev/check_repository.py
      - name: Run offline regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check frontend/shared/app-update.js
          node --check frontend/canvas/canvas.js
          node --check frontend/canvas/canvas-sync.js
          node --check frontend/canvas/canvas-compose.js
      - run: git diff --check
